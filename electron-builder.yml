appId: com.menta11.ccsa
productName: Claude会话耗时分析
copyright: Copyright © 2026 menta11
directories:
  output: dist
# 国内网络镜像（GitHub 下载超时）：electron 二进制 + electron-builder 工具链走 npmmirror
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
# 砍掉非中英文语言包（electron 二进制内的 .lproj 本地化资源，减肥）
electronLanguages:
  - en
  - zh-CN
# 打包后钩子：mac 平台对 .app 做 ad-hoc 自签（dmg 生成前注入，dmg 内即已签名）
afterPack: ./build/sign-mac.js
files:
  - 'out/**/*'
  - 'package.json'
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!justfile'
  - '!justfile.*'
  - '!docs/**'
  - '!test/**'
  - '!dist/**'
win:
  icon: build/icon.png
  target:
    - nsis
    - portable
  executableName: cc-session-analysis-tool
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  shortcutName: Claude会话耗时分析
  artifactName: ccsa-${version}-setup.${ext}
portable:
  artifactName: ccsa-${version}-portable.${ext}
mac:
  target:
    - dmg
  category: public.app-category.developer-tools
linux:
  target:
    - AppImage
    - deb
  category: Development
  icon: build/icon.png
