// --- 顶部: 流请求 (HTTP 视角) + 异常事件 (系统视角) 左右分栏, 两 panel 各自独立状态 ---
const EV_MAX_RENDER = 200;
const EV_SEVERITY_ICON = { error: '🔴', warn: '🟠', notice: '🟡', info: '🟢' };
const FOLLOW_THRESHOLD_PX = 24;
// 异常事件 panel 状态 (系统视角): 数据 + 追新
let evAll = [];
let evCounters = { error: 0, warn: 0, notice: 0 };
const evActive = { error: true, warn: true, notice: true };
let evFollowing = true;       // true = 在底部自动追新; false = 反向滚停追
let evPending = 0;            // 停追期间累积条数 (浮标显示)

// 流请求 panel 状态 (HTTP 视角): 数据 + 追新
let reqAll = [];
let reqCounters = { all: 0, ok: 0, err: 0, pending: 0 };
const reqActive = { all: true, ok: true, err: true };
let reqFollowing = true;
let reqPending = 0;

function evAtBottom() {
  const body = document.getElementById('evBody');
  return body.scrollHeight - body.scrollTop - body.clientHeight < FOLLOW_THRESHOLD_PX;
}
function reqAtBottom() {
  const body = document.getElementById('reqBody');
  return body.scrollHeight - body.scrollTop - body.clientHeight < FOLLOW_THRESHOLD_PX;
}

function updateEvJump() {
  const badge = document.getElementById('evJump');
  badge.hidden = evFollowing;
  if (!evFollowing) document.getElementById('evJumpN').textContent = evPending;
}
function updateReqJump() {
  const badge = document.getElementById('reqJump');
  badge.hidden = reqFollowing;
  if (!reqFollowing) document.getElementById('reqJumpN').textContent = reqPending;
}

function renderEvent(ev) {
  if (!evActive[ev.severity]) return;
  const body = document.getElementById('evBody');
  body.classList.add('has-events');
  const row = document.createElement('div');
  row.className = 'ev-row ev-row-' + ev.severity;
  row.dataset.type = ev.type;
  // ★ cid 透传: 详情抽屉 (openEventDrawer) 用它 fetch /event/detail 取完整 HTTP 流.
  //   proxy 端 recordEvent 自动 merge correlationId → ev.detail.correlationId.
  if (ev.detail && ev.detail.correlationId) {
    row.dataset.cid = ev.detail.correlationId;
    row.tabIndex = 0;        // 键盘可达 (Enter / Space 打开)
    row.setAttribute('role', 'button');
  }
  const ts = ev.ts ? fmtTime(ev.ts) : '--:--:--';
  const agent = ev.agentId ? esc(ev.agentId) : '<unknown>';
  const count = (ev.count && ev.count > 1) ? '×' + ev.count : '';
  row.innerHTML =
    '<span class="ev-ts">' + ts + '</span>' +
    '<span class="ev-icon">' + (EV_SEVERITY_ICON[ev.severity] || '⚪') + '</span>' +
    '<span class="ev-agent" title="' + agent + '">' + agent + '</span>' +
    '<span class="ev-type">' + esc(ev.type || '') + '</span>' +
    '<span class="ev-msg" title="' + esc(ev.message || '') + '">' + esc(ev.message || '') + '</span>' +
    '<span class="ev-count">' + count + '</span>';
  body.appendChild(row);
  while (body.children.length > EV_MAX_RENDER) body.removeChild(body.firstChild);
  // 追新模式 → 自动滚到底; 反向滚模式 → 不动 scrollTop, 让用户继续看
  if (evFollowing) {
    body.scrollTop = body.scrollHeight;
  } else {
    evPending++;
    updateEvJump();
  }
}

function updateChipCounters() {
  for (const sev of ['error', 'warn', 'notice']) {
    const el = document.getElementById('evCount' + sev[0].toUpperCase() + sev.slice(1));
    if (el) el.textContent = evCounters[sev];
  }
}

function ingestEvent(ev) {
  if (!ev || !ev.severity || !ev.type) return;
  evCounters[ev.severity] = (evCounters[ev.severity] || 0) + 1;
  evAll.push(ev);
  if (evAll.length > EV_MAX_RENDER) evAll.shift();
  updateChipCounters();
  renderEvent(ev);
}

// --- 流请求渲染 ---
function classifyRequest(req) {
  // 进行中 (pending) 判定:
  //   SSE 流 — 上游响应头一到就是 200, 但字节可能还在输出. 用 ended (流 end 落定) 判,
  //            否则流式中段 (status=200, 字节还在打) 被误判 ok (绿色).
  //   非 SSE  — statusCode=0 (响应头未到) 即 pending.
  // 已结束: 2xx/3xx=ok, 其他=err.
  const s = req.statusCode || 0;
  const pending = req.isSSE ? !req.ended : s === 0;
  if (pending) return 'pending';
  return (s >= 200 && s < 400) ? 'ok' : 'err';
}
// req-row class: cat (pending/ok/err) 驱动 border 色; pending 且 phase='think' 叠加紫色覆盖.
// text / 等首字 (phase=null) → 默认橙; 完成态 (ok/err) 色不变. renderRequest + updateRequestRow 共用.
function reqRowClass(cat, phase) {
  return 'req-row req-row-' + cat +
    (cat === 'pending' && phase === 'think' ? ' req-phase-think' : '');
}
// agent 列显示: 真 agentId 优先 (header 解析出的 session:main/sub); unknown/null → trace 短码兜底,
// 让每行有唯一标识 (cid 前 8 位, 完整 cid 在详情抽屉 copy-trace 按钮可复制).
function reqAgentLabel(req) {
  const has = req && req.agentId && req.agentId !== 'unknown';
  const cid = String((req && req.cid) || '');
  return has
    ? { text: req.agentId, title: req.agentId }
    : { text: '#' + cid.slice(0, 8), title: 'trace: ' + cid };
}

function renderRequest(req) {
  const cat = classifyRequest(req);
  // pending (进行中) 归 "全部" chip: all 开则显示; ok/err 跟各自 chip.
  const visible = (cat === 'pending') ? reqActive.all : reqActive[cat];
  if (!visible) return;
  const body = document.getElementById('reqBody');
  const row = document.createElement('div');
  row.className = reqRowClass(cat, req.phase);
  row.dataset.cid = req.cid;
  row.dataset.status = String(req.statusCode || 0);
  row.tabIndex = 0;
  row.setAttribute('role', 'button');
  const ts = req.ts ? fmtTime(req.ts) : '--:--:--';
  const _ag = reqAgentLabel(req);
  const sizeBytes = req.sseBytesSize || req.respBodySize || 0;
  const sizeText = sizeBytes > 0 ? esc(formatBytes(sizeBytes)) : '';
  const statusText = req.statusCode ? String(req.statusCode) : '...';
  const method = req.method || '?';
  const url = req.url || '';
  const sseTag = req.isSSE ? ' [SSE]' : '';
  // 首字耗时 (TTFB): SSE=第一个内容 delta 到 / 非SSE=响应头到 - 请求开始. 未到 → '—'.
  // 总耗时: 流 end → 精确; 流进行中 → 估算 (sumary 里的 totalMs 用 Date.now()-ts 算, 流未结束时为估算值).
  // 耗时分级: 流进行中=橙 (live, 一律); 结束时按 ms / 1s / 10s / 30s / 5m 分级 (其中 < 1s 一律绿).
  const ttfbText = Number.isFinite(req.firstByteMs) ? esc(formatIdle(req.firstByteMs)) : '—';
  const totalText = Number.isFinite(req.totalMs) ? esc(formatIdle(req.totalMs)) : '—';
  const totalClass = totalColorClass(req.totalMs, cat === 'pending' || req.statusCode === 0);
  row.innerHTML =
    '<span class="req-ts">' + ts + '</span>' +
    '<span class="req-status">' + esc(statusText) + '</span>' +
    '<span class="req-method">' + esc(method) + sseTag + '</span>' +
    '<span class="req-url" title="' + esc(url) + '">' + esc(url) + '</span>' +
    '<span class="req-agent" title="' + esc(_ag.title) + '">' + esc(_ag.text) + '</span>' +
    '<span class="req-ttfb">' + ttfbText + '</span>' +
    '<span class="' + totalClass + '">' + totalText + '</span>' +
    '<span class="req-size">' + sizeText + '</span>';
  body.appendChild(row);
  while (body.children.length > EV_MAX_RENDER) body.removeChild(body.firstChild);
  body.classList.add('has-events');
  if (reqFollowing) body.scrollTop = body.scrollHeight;
  else { reqPending++; updateReqJump(); }
}

// 原地更新已有流请求行: 只改 status / size / ttfb / total / 分类, 不重建 DOM (保持位置 + hover/滚动状态).
// 流式更新 (同 cid size 持续增长) 用它, 避免旧行 remove + 新行 append 导致行跳到底部.
// total 颜色: 流进行中 → 橙 (估算); 流结束 → 默认 (精确).
function updateRequestRow(row, req) {
  const cat = classifyRequest(req);
  const visible = (cat === 'pending') ? reqActive.all : reqActive[cat];
  row.className = reqRowClass(cat, req.phase);
  row.dataset.status = String(req.statusCode || 0);
  const statusEl = row.querySelector('.req-status');
  if (statusEl) statusEl.textContent = req.statusCode ? String(req.statusCode) : '...';
  // agentId 回填后重广播 → 原地刷新 agent 列 (unknown 行也会更新成真值或 trace 短码).
  const _ag = reqAgentLabel(req);
  const agentEl = row.querySelector('.req-agent');
  if (agentEl) { agentEl.textContent = _ag.text; agentEl.title = _ag.title; }
  const sizeBytes = req.sseBytesSize || req.respBodySize || 0;
  const sizeEl = row.querySelector('.req-size');
  if (sizeEl) sizeEl.textContent = sizeBytes > 0 ? formatBytes(sizeBytes) : '';
  const ttfbEl = row.querySelector('.req-ttfb');
  if (ttfbEl) ttfbEl.textContent = Number.isFinite(req.firstByteMs) ? formatIdle(req.firstByteMs) : '—';
  const totalEl = row.querySelector('.req-total');
  if (totalEl) {
    totalEl.textContent = Number.isFinite(req.totalMs) ? formatIdle(req.totalMs) : '—';
    totalEl.className = totalColorClass(req.totalMs, cat === 'pending' || req.statusCode === 0);
  }
  row.style.display = visible ? '' : 'none';
}

// 总耗时分级着色: 流进行中一律橙 (live, 提示估算中); 结束时按阈值分级.
// 阈值 (ms): <1s 一律绿 (毫秒级); 1s/10s/30s/5m 四档.
function totalColorClass(totalMs, isLive) {
  if (isLive) return 'req-total live';
  if (!Number.isFinite(totalMs)) return 'req-total';           // 未知 → 默认
  if (totalMs < 1000)  return 'req-total f-fast';             // < 1s 绿
  if (totalMs < 10000) return 'req-total f-ok';               // 1s ~ 10s  默认灰
  if (totalMs < 30000) return 'req-total f-warn';             // 10s ~ 30s 黄
  if (totalMs < 300000) return 'req-total f-slow';            // 30s ~ 5m  橙
  return 'req-total f-error';                                  // > 5m     红
}

function updateRequestChipCounters() {
  for (const k of ['all', 'ok', 'err']) {
    const el = document.getElementById('reqCount' + k[0].toUpperCase() + k.slice(1));
    if (el) el.textContent = reqCounters[k];
  }
}

function ingestRequest(req) {
  if (!req || !req.cid) return;
  // 去重: 同一 cid 只保留最新 summary (请求进行中 statusCode=0, 完成后 SSE 推 statusCode=200 的新条目)
  const cat = classifyRequest(req);
  const existingIdx = reqAll.findIndex(r => r.cid === req.cid);
  if (existingIdx >= 0) {
    const old = reqAll[existingIdx];
    const oldCat = classifyRequest(old);
    // 状态变更: pending → ok/err, 计数器从 pending 移到新分类
    reqCounters[oldCat] = Math.max(0, reqCounters[oldCat] - 1);
    reqCounters[cat]++;
    reqAll[existingIdx] = req;
  } else {
    reqCounters.all++;
    reqCounters[cat]++;
    reqAll.push(req);
  }
  if (reqAll.length > EV_MAX_RENDER) reqAll.shift();
  updateRequestChipCounters();
  // 同 cid 已有行 → 原地更新 status/size/分类, 不移动位置 (流式更新时行不跳到底部, 不打断滚动).
  // 新 cid → renderRequest 追加新行到底部.
  const oldRow = document.querySelector('.req-row[data-cid="' + req.cid + '"]');
  if (oldRow) updateRequestRow(oldRow, req);
  else renderRequest(req);
}

// chip 切换 → 重渲染 (用 evAll 内存回放)
document.querySelectorAll('#evChips .event-chip').forEach(chip => {
  chip.addEventListener('click', () => {
    const sev = chip.dataset.sev;
    evActive[sev] = !evActive[sev];
    chip.dataset.on = evActive[sev] ? 'true' : 'false';
    const body = document.getElementById('evBody');
    body.replaceChildren();
    const filtered = evAll.filter(e => evActive[e.severity]);
    if (filtered.length === 0) {
      body.classList.remove('has-events');
      evPending = 0;
      updateEvJump();
      return;
    }
    for (const ev of filtered) renderEvent(ev);
  });
});

// 流请求 chip 切换 (status)
document.querySelectorAll('#reqChips .event-chip').forEach(chip => {
  chip.addEventListener('click', () => {
    const k = chip.dataset.status;
    reqActive[k] = !reqActive[k];
    chip.dataset.on = reqActive[k] ? 'true' : 'false';
    const body = document.getElementById('reqBody');
    body.replaceChildren();
    reqPending = 0;
    updateReqJump();
    for (const r of reqAll) renderRequest(r);
  });
});

// 反向滚动检测: 用户向上滚 → 停止追新, 浮标显示累积数. 滚到底 → 自动恢复追新, 清零累积.
// 两 panel 各自独立滚动状态 (流请求 / 异常事件 互不影响).
document.getElementById('evBody').addEventListener('scroll', () => {
  const atBottom = evAtBottom();
  if (atBottom && !evFollowing) { evFollowing = true; evPending = 0; updateEvJump(); }
  else if (!atBottom && evFollowing) { evFollowing = false; updateEvJump(); }
});
document.getElementById('reqBody').addEventListener('scroll', () => {
  const atBottom = reqAtBottom();
  if (atBottom && !reqFollowing) { reqFollowing = true; reqPending = 0; updateReqJump(); }
  else if (!atBottom && reqFollowing) { reqFollowing = false; updateReqJump(); }
});

// 点浮标 → 滚到底 (顺势触发 scroll listener 恢复追新)
document.getElementById('evJump').addEventListener('click', () => {
  const body = document.getElementById('evBody');
  body.scrollTop = body.scrollHeight;
});
document.getElementById('reqJump').addEventListener('click', () => {
  const body = document.getElementById('reqBody');
  body.scrollTop = body.scrollHeight;
});

// 清空本地视图: evAll 内存 + 计数 + DOM. proxy 端 ring 由 /events/clear 清, 之后通过
// SSE 'clear' 命名事件通知所有订阅端同步, 保证多 tab / 多 dashboard 视图一致.
function clearLocalEvents() {
  evAll = [];
  evCounters = { error: 0, warn: 0, notice: 0 };
  evPending = 0;
  const body = document.getElementById('evBody');
  body.replaceChildren();
  body.classList.remove('has-events');
  updateChipCounters();
  updateEvJump();
}

function clearLocalRequests() {
  reqAll = [];
  reqCounters = { all: 0, ok: 0, err: 0 };
  reqPending = 0;
  const body = document.getElementById('reqBody');
  body.replaceChildren();
  body.classList.remove('has-events');
  updateRequestChipCounters();
  updateReqJump();
}

document.getElementById('evClear').addEventListener('click', async () => {
  try { await fetch('/events/clear', { method: 'POST' }); } catch (e) {}
  clearLocalEvents();
});
document.getElementById('reqClear').addEventListener('click', async () => {
  try { await fetch('/requests/clear', { method: 'POST' }); } catch (e) {}
  clearLocalRequests();
});

// EventSource: 浏览器原生自动重连. proxy 端 /events/stream 推送.
function startEventStream() {
  let es;
  try {
    es = new EventSource('/events/stream');
  } catch (e) { return; }
  es.onmessage = (msg) => {
    try {
      const ev = JSON.parse(msg.data);
      ingestEvent(ev);
    } catch (e) {}
  };
  // 命名事件: proxy 端 _broadcastClear() 推送 'event: clear' → 同步清本地视图.
  // (默认 onmessage 不会触发命名事件, 必须 addEventListener)
  es.addEventListener('clear', () => clearLocalEvents());
  // onerror: 浏览器自动重连, 不需手动. 但要保证 es 引用保留不被 GC.
  es.onerror = () => {};
  window.__evEs = es;
}
startEventStream();

// --- SSE 订阅: 流请求 ---
function startRequestStream() {
  let es;
  try { es = new EventSource('/requests/stream'); } catch (e) { return; }
  es.onmessage = (msg) => {
    try { ingestRequest(JSON.parse(msg.data)); } catch (e) {}
  };
  es.addEventListener('clear', () => clearLocalRequests());
  es.onerror = () => {};
  window.__reqEs = es;
}
startRequestStream();

// --- 流请求 / 异常事件列表高度拖动 ---
// 默认 110px (与 .event-bar-body.has-events 一致), 用户拖动后存 localStorage, 跨刷新保留.
// 范围: 60 ~ 60vh (太小看不出, 太大盖住 agent 行).
function applyBarHeight(px) {
  // 左右两 panel 的 body 同高, 一个拖动条同步调两边
  for (const id of ['reqBody', 'evBody']) {
    const body = document.getElementById(id);
    if (body) body.style.height = px + 'px';
  }
}
function loadBarHeight() {
  try {
    const v = parseInt(localStorage.getItem('cc.eventBarHeight'), 10);
    if (Number.isFinite(v) && v >= 60 && v <= window.innerHeight * 0.6) {
      applyBarHeight(v);
      return true;
    }
  } catch (e) {}
  return false;
}
function saveBarHeight(px) {
  try { localStorage.setItem('cc.eventBarHeight', String(Math.round(px))); } catch (e) {}
}
(function initResizer() {
  const reqBody = document.getElementById('reqBody');
  const evBody = document.getElementById('evBody');
  const resizer = document.getElementById('barResizer');
  if (!reqBody || !evBody || !resizer) return;
  // 加载持久化高度 (两 body 同高, has-events 由渲染逻辑设)
  if (loadBarHeight()) {
    reqBody.classList.add('has-events');
    evBody.classList.add('has-events');
  }
  // 任一 body 有事件 → 显示 resizer; 两个都空 → 隐藏 (避免没列表还显示拖动条)
  const syncVisible = () => {
    const has = reqBody.classList.contains('has-events') || evBody.classList.contains('has-events');
    resizer.style.display = has ? '' : 'none';
  };
  syncVisible();
  // has-events 由 renderEvent / renderRequest / clearX 设, 用 MutationObserver 监听两 body 同步
  new MutationObserver(syncVisible).observe(reqBody, { attributes: true, attributeFilter: ['class'] });
  new MutationObserver(syncVisible).observe(evBody, { attributes: true, attributeFilter: ['class'] });
  // 拖动: mousedown 在 resizer, mousemove 同步改两 body 高度, mouseup 存盘
  let startY = 0, startH = 0, dragging = false;
  resizer.addEventListener('mousedown', (e) => {
    dragging = true;
    startY = e.clientY;
    startH = reqBody.offsetHeight;
    document.body.classList.add('dragging-resizer');
    e.preventDefault();
  });
  document.addEventListener('mousemove', (e) => {
    if (!dragging) return;
    // 拖下 = 高度变大 (resizer 在 body 下, 鼠标向下拉让 body 增高)
    const dh = e.clientY - startY;
    const next = Math.max(60, Math.min(window.innerHeight * 0.6, startH + dh));
    applyBarHeight(next);
  });
  document.addEventListener('mouseup', () => {
    if (!dragging) return;
    dragging = false;
    document.body.classList.remove('dragging-resizer');
    saveBarHeight(reqBody.offsetHeight);
  });
})();

// --- HTTP 详情抽屉: 点 ev-row / req-row → 调 /event/detail?cid= → 渲染 Request/Response/SSE/Headers tabs ---
// 复用 #sessionDrawer 容器 (与 openSessionDrawer / openPromptsDrawer 互斥展示).
// 两 panel 各自委托 (evBody 绑 ev-row, reqBody 绑 req-row), 动态插入 (live + chip 重放) 都生效.
function bindDrawerOpen(root) {
  root.addEventListener('click', (e) => {
    const row = e.target.closest('.ev-row') || e.target.closest('.req-row');
    if (!row || !row.dataset.cid) return;
    openEventDrawer(row.dataset.cid, row);
  });
  root.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    const row = e.target.closest('.ev-row') || e.target.closest('.req-row');
    if (!row || !row.dataset.cid) return;
    e.preventDefault();
    openEventDrawer(row.dataset.cid, row);
  });
}
bindDrawerOpen(document.getElementById('evBody'));
bindDrawerOpen(document.getElementById('reqBody'));

// Dev 热加载: 探测 /__dev_mtime__(生产不挂返回404), 存在则每1s轮询, mtime变→自动reload
(async () => {
  try {
    const probe = await fetch('/__dev_mtime__');
    if (!probe.ok) return;
    let last = (await probe.json()).mtime;
    setInterval(async () => {
      try {
        const r = await fetch('/__dev_mtime__');
        if (!r.ok) return;
        const m = (await r.json()).mtime;
        if (m !== last) location.reload();
      } catch (e) {}
    }, 1000);
  } catch (e) {}
})();
</script>
</body>
</html>
